[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "local-meeting-assistant"
version = "0.1.0"
description = "Assistente locale Windows per registrare, trascrivere e riassumere meeting e conversazioni."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Local Meeting Assistant" }]
dependencies = [
  "PySide6>=6.8,<7",
  "numpy>=1.26,<3",
  "soundcard>=0.4.4,<0.5",
  "sounddevice>=0.5,<0.6",
  "soundfile>=0.12,<1",
  "faster-whisper>=1.1,<2",
  "transcribe-cpp>=0.2.3,<0.3",
  "psutil>=6,<8",
  "pycaw>=20240210",
  "PyAudioWPatch>=0.2.12.7,<0.3",
  "pywinauto>=0.6.9,<0.7",
  "platformdirs>=4,<5",
  "httpx>=0.28,<1",
  "send2trash>=1.8,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
meeting-assistant = "local_meeting_assistant.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_meeting_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
